name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run tsc

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Install Playwright system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium

      - name: Create .env.local
        run: |
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_SUPABASE_SECRET_KEY=${{ secrets.NEXT_SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          EOF

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          E2E_PRIVATE_WIKI_OWNER: ${{ secrets.E2E_PRIVATE_WIKI_OWNER }}
          E2E_PRIVATE_WIKI_REPO: ${{ secrets.E2E_PRIVATE_WIKI_REPO }}
          E2E_PRIVATE_WIKI_OVERVIEW_SNIPPET: ${{ secrets.E2E_PRIVATE_WIKI_OVERVIEW_SNIPPET }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
